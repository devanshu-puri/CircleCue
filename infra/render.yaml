services:
  - type: web
    name: circlecue-web
    env: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://circlecue-api.onrender.com
      - key: NODE_VERSION
        value: "20"

  - type: web
    name: circlecue-api
    env: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_PROVIDER
        value: rules
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        value: gemma-3-4b-it
      - key: AI_API_KEY
        sync: false
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: SENTRY_DSN
        sync: false
